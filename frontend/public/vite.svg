<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61dafb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20232a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- React Logo -->
  <g transform="translate(100,100)">
    <!-- Outer ring -->
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#61dafb" stroke-width="6" />
    <!-- Middle ring -->
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#61dafb" stroke-width="6" transform="rotate(60)" />
    <!-- Inner ring -->
    <ellipse cx="0" cy="0" rx="70" ry="25" fill="none" stroke="#61dafb" stroke-width="6" transform="rotate(-60)" />
    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#61dafb" />
  </g>
</svg>